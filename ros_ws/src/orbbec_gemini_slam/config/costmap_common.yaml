# =============================================================
# costmap_common.yaml — move_base 通用代价地图参数
# STM32-SLAM-Robot (D435 深度相机 + 深度图转伪激光)
# =============================================================

# 机器人足迹（矩形，单位米）
# 小车底盘约 25cm x 20cm
footoring: [[0.13, 0.11], [0.13, -0.11], [-0.13, -0.11], [-0.13, 0.11]]

# 膨胀层
inflation_layer:
  inflation_radius: 0.30   # 膨胀半径（米）
  cost_scaling_factor: 5.0  # 代价衰减速率

# 障碍物层（来自 /scan 伪激光）
obstacle_layer:
  observation_sources: scan
  scan:
    topic: /scan
    data_type: LaserScan
    marking: true
    clearing: true
    max_obstacle_height: 2.0
    min_obstacle_height: 0.05
    obstacle_range: 4.0
    raytrace_range: 5.0

# 全局坐标系
global_frame: map
robot_base_frame: camera_link

# 更新频率
update_frequency: 2.0
publish_frequency: 1.0
